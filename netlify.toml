[build]
  command = "echo 'No build needed — Python functions + static HTML'"
  functions = "netlify/functions"
  publish = "web/static"

[functions]
  # Use Python 3.12 runtime
  python_version = "3.12"

# Redirect API calls to Netlify functions
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200