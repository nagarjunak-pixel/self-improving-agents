name: CI — Syntax Check & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Compile all Python files
        run: |
          find . -name "*.py" -not -path "./.github/*" | xargs python -m py_compile

      - name: Lint with ruff
        run: ruff check . --select E9,F63,F7,F82 --ignore F821 || true

      - name: Verify project structure
        run: |
          echo "Checking required files exist..."
          for f in core/agent.py core/reflexion.py core/memory.py core/tools.py core/trace.py \
                   agents/orchestrator.py agents/planner.py agents/worker.py agents/critic.py agents/judge.py \
                   tools/builtin.py examples/demo.py netlify/functions/agent-api.py web/static/index.html \
                   netlify.toml TRAINER_GUIDE.md README.md; do
            if [ ! -f "$f" ]; then echo "❌ MISSING: $f"; exit 1; fi
            echo "✅ $f"
          done